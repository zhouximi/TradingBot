spring.application.name=SwingTradingBot
server.port=8081

ibkr.host=${IBKR_HOST:127.0.0.1}
ibkr.port=${IBKR_PORT:7496}
ibkr.client-id=${IBKR_CLIENT_ID:1}
spring.mvc.async.request-timeout=75s
server.error.include-message=always

# Local development
server.address=127.0.0.1

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tradingbot}
spring.datasource.username=${DB_USER:xianming}
spring.datasource.password=${DB_PASSWORD:}

# MCP
spring.ai.mcp.server.name=tradingbot
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp


